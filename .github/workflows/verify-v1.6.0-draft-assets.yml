name: Verify v1.6.0 draft assets

on:
  push:
    branches:
      - prepare/v1.6.0
    paths:
      - .github/workflows/verify-v1.6.0-draft-assets.yml

permissions:
  contents: read

jobs:
  check-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify draft release assets against bundled checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import urllib.request
          import zipfile

          base = 'https://api.github.com/repos/M-Nesuka/X-Archive-Gallery'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'XArchiveGallery-release-verifier'
          }
          def get_json(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=45) as result:
                  return json.load(result)
          def fetch_asset(asset):
              h = dict(headers)
              h['Accept'] = 'application/octet-stream'
              url = base + '/releases/assets/' + str(asset['id'])
              with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=90) as result:
                  data = result.read()
              if data.startswith(b'{') and b'browser_download_url' in data[:400]:
                  raise RuntimeError('GitHub returned asset metadata, not file bytes')
              return data

          release = get_json(base + '/releases/424713326')
          assert release['tag_name'] == '1.6.0' and release['draft'] is True
          assert release['target_commitish'] == 'main'
          assets = {a['name']:a for a in release['assets']}
          names = {
             'SHA256SUMS.txt',
             'XArchiveGallery_v1.6.0_Windows_x64.zip',
             'XArchiveGallery_v1.6.0_ThirdPartySources.zip'
          }
          assert set(assets) == names, 'Unexpected or missing draft release asset(s)'
          assert all(a['state'] == 'uploaded' for a in assets.values()), 'Upload unfinished'

          sums = fetch_asset(assets['SHA256SUMS.txt']).decode('utf-8-sig')
          expected = {}
          for line in sums.splitlines():
              hashvalue, sep, name = line.partition('  ')
              assert sep and len(hashvalue)==64 and len(name)>0
              expected[name] = hashvalue.lower()
          assert set(expected) == {
              'XArchiveGallery_v1.6.0_Windows_x64.zip',
              'XArchiveGallery_v1.6.0_ThirdPartySources.zip',
              'XArchiveGallery/XArchiveGallery.exe'
          }, 'Unexpected checksum entries'
          for name in ['XArchiveGallery_v1.6.0_Windows_x64.zip','XArchiveGallery_v1.6.0_ThirdPartySources.zip']:
              digest = assets[name].get('digest','').replace('sha256:','')
              assert digest == expected[name], f'CHECKSUM MISMATCH: {name}'
              print('PASS: ' + name + ' SHA-256 equals manifest')

          windows_data = fetch_asset(assets['XArchiveGallery_v1.6.0_Windows_x64.zip'])
          actual = hashlib.sha256(windows_data).hexdigest()
          assert actual == expected['XArchiveGallery_v1.6.0_Windows_x64.zip'], 'Downloaded Windows ZIP hash mismatch'
          with zipfile.ZipFile(io.BytesIO(windows_data)) as z:
              with z.open('XArchiveGallery/XArchiveGallery.exe') as executable:
                  actual_exe = hashlib.file_digest(executable,'sha256').hexdigest()
          assert actual_exe == expected['XArchiveGallery/XArchiveGallery.exe'], 'Embedded EXE SHA-256 mismatch'
          print('PASS: embedded EXE SHA-256 equals manifest')
          print('PASS: all three manifest entries match the assets currently attached to the draft release')
          PY
